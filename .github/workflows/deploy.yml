name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an in-flight Pages deployment, as that can leave Pages in a stuck state
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build and upload are split from the deployment, so "re-run failed jobs" only retries the deploy
  # and reuses the already uploaded artifact (no duplicate-artifact conflicts)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Overwrite Last Updated
        run: |
          TIMESTAMP="${{ github.event.head_commit.timestamp }}"
          if [ -z "$TIMESTAMP" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi
          sed -i "s/const LAST_UPDATED = \"[^\"]*\";/const LAST_UPDATED = \"$TIMESTAMP\";/" src/components/LastUpdated.tsx
        
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Add '.nojekyll' file
        run: touch ./dist/.nojekyll
      - name: Verify build artifacts
        run: |
          echo "Build output size:"
          du -sh ./dist
          echo "Files in dist:"
          find ./dist -type f | head -20
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
          retention-days: 1

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry-1.outputs.page_url || steps.deployment-retry-2.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # timeout is in milliseconds; GitHub Pages queues can be slow, so wait up to 15 minutes per attempt
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
          error_count: 20
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (retry 1)
        id: deployment-retry-1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
          error_count: 20
      - name: Wait before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry-1.outcome == 'failure'
        run: sleep 120
      - name: Deploy to GitHub Pages (retry 2)
        id: deployment-retry-2
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry-1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
          error_count: 20
